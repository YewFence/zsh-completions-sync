name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish"
        required: true
        type: string
      overwrite_latest_tag:
        description: "Whether to overwrite the latest tag"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Whether to mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'release'
      )
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      should_release: ${{ steps.release.outputs.should_release }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - name: Ensure tag input
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          echo "tag must not be empty"
          exit 1

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.tag || github.ref }}
          fetch-depth: 0
          filter: blob:none

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: git-cliff
          add_shims_to_path: true
          cache_key: "mise-release-version-{{install_args_hash}}-{{file_hash}}"

      - name: Resolve release metadata
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag=""
          checkout_ref="${GITHUB_SHA}"
          should_release="false"
          create_tag="false"
          prerelease="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
            checkout_ref="${INPUT_TAG}"
            should_release="true"
            prerelease="${INPUT_PRERELEASE}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${REF_NAME}"
            checkout_ref="${REF_NAME}"
            should_release="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            tag="$(mise run release:tag)"
            checkout_ref="${MERGE_COMMIT_SHA:-${GITHUB_SHA}}"
            should_release="true"
            create_tag="true"
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "${tag}" == *-* ]]; then
            prerelease="true"
          fi

          {
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "checkout_ref=${checkout_ref}"
            echo "should_release=${should_release}"
            echo "create_tag=${create_tag}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    if: ${{ needs.version.outputs.should_release == 'true' }}
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: go
          add_shims_to_path: true
          cache_key: "mise-release-{{install_args_hash}}-{{file_hash}}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.goos }}-${{ matrix.goarch }}-
            go-${{ runner.os }}-

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ needs.version.outputs.version }}
          BUILD_OUTPUT_DIR: dist
        run: mise run build

      - name: Package artifact
        env:
          ARTIFACT_NAME: ${{ needs.version.outputs.tag }}-${{ matrix.goos }}-${{ matrix.goarch }}
          ARTIFACT_EXT: ${{ matrix.goos == 'windows' && 'zip' || 'tar.gz' }}
        run: |
          binary_path="$(find dist -maxdepth 1 -type f ! -name '*.tar.gz' ! -name '*.zip' -print -quit)"
          if [[ -z "${binary_path}" ]]; then
            echo "No build artifact was found"
            exit 1
          fi
          binary_name="$(basename "${binary_path}")"

          if [[ "${ARTIFACT_EXT}" == "zip" ]]; then
            (cd dist && zip -j "${ARTIFACT_NAME}.zip" "${binary_name}")
          else
            tar -C dist -czf "dist/${ARTIFACT_NAME}.tar.gz" "${binary_name}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "binary-${{ matrix.goos }}-${{ matrix.goarch }}"
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - version
      - build
    if: ${{ needs.version.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.version.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: git-cliff
          add_shims_to_path: true
          cache_key: "mise-release-notes-{{install_args_hash}}-{{file_hash}}"

      - name: Generate release notes
        id: notes
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          RELEASE_NOTES_OUTPUT="${notes_file}" mise run release:notes

          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create release tag
        if: ${{ needs.version.outputs.create_tag == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          mise run release:tag:create
          git push origin "${RELEASE_TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*
          prerelease: ${{ needs.version.outputs.prerelease }}

      - name: Move latest tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.overwrite_latest_tag }}
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force

          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          git tag -fa latest -m "latest -> ${RELEASE_TAG}" "${release_commit}"
          git push --force origin refs/tags/latest
