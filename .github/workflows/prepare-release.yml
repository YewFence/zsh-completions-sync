name: Prepare Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_LOCKED: "1"
      MISE_ENV: "ci"
      RELEASE_BRANCH: release
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - name: Setup mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: git-cliff
          add_shims_to_path: true
          cache_key: "mise-prepare-release-{{install_args_hash}}-{{file_hash}}"

      - name: Resolve release version
        id: release
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(mise run release:tag)"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          RELEASE_TAG="${tag}" RELEASE_NOTES_OUTPUT="${notes_file}" mise run release:notes

          should_prepare="true"
          if ! grep -Eq '^[[:space:]]*[*-] ' "${notes_file}"; then
            should_prepare="false"
          fi

          {
            echo "tag=${tag}"
            echo "notes_file=${notes_file}"
            echo "should_prepare=${should_prepare}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stop when there are no release notes
        if: ${{ steps.release.outputs.should_prepare != 'true' }}
        run: echo "No release notes were generated. Skipping release PR."

      - name: Update changelog
        if: ${{ steps.release.outputs.should_prepare == 'true' }}
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: mise run release:changelog

      - name: Push release branch
        id: branch
        if: ${{ steps.release.outputs.should_prepare == 'true' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "${RELEASE_BRANCH}"
          git add CHANGELOG.md
          git commit -m "chore(release): prepare ${RELEASE_TAG}"
          git push --force origin "HEAD:${RELEASE_BRANCH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create or update release PR
        if: ${{ steps.branch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          body_file="${RUNNER_TEMP}/release-pr-body.md"
          {
            echo "Prepare ${RELEASE_TAG}."
            echo
            cat "${RELEASE_NOTES_FILE}"
          } > "${body_file}"

          pr_number="$(gh pr list --head "${RELEASE_BRANCH}" --base main --state open --json number --jq '.[0].number // ""')"
          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" --title "release: ${RELEASE_TAG}" --body-file "${body_file}"
          else
            gh pr create --head "${RELEASE_BRANCH}" --base main --title "chore: release ${RELEASE_TAG}" --body-file "${body_file}"
          fi
